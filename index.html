<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget=resizes-content: al abrir el teclado, el navegador
         REDUCE el viewport en vez de desplazar la página. Sin esto había que
         pelearse con visualViewport desde JavaScript, y eso rompía el layout. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2C4A35" />
    <title>Centro Anantara — Admin</title>
    <!-- PWA "Bot móvil" (pantalla nueva para la secretaria, ver src/components/BotMovil.jsx).
         Desde el encargo 5.2 SÍ hay un service worker, public/sw-push.js, pero
         SOLO para avisos push: sin handler de `fetch` ni Cache API, precisamente
         para no caer en lo que se quería evitar antes (uno mal hecho sirviendo
         versiones viejas del panel). Se registra solo cuando alguien pulsa
         "Activar avisos" en Bot Móvil (src/lib/push.js), nunca al cargar la app. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1d5c2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
